name: Daily Cron Jobs

on:
  schedule:
    - cron: '5 17 * * *'  # 00:05 WIB (UTC+7)
  workflow_dispatch:       # bisa trigger manual dari GitHub

jobs:
  expire-premium:
    runs-on: ubuntu-latest
    steps:
      - name: Expire premium users
        run: |
          curl -sf -X GET https://kodevo.id/api/cron/expire-premium \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
